<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Découpe d'attestations · CNH</title>

  <!-- Polices (chargées si connexion ; sinon repli système élégant) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Albert+Sans:wght@400;500;600;700&family=Spline+Sans+Mono:wght@500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="./styles.css" />

  <!-- Librairies embarquées (fonctionnent hors-ligne) -->
  <script src="./lib/pdf.min.js"></script>
  <script src="./lib/pdf-lib.min.js"></script>
  <script src="./lib/jszip.min.js"></script>
</head>
<body>
  <div class="water" aria-hidden="true"></div>

  <main class="shell">
    <header class="hero">
      <div class="hero__badge">Club Nautique Herblinois</div>
      <h1 class="hero__title">Découpe d'attestations</h1>
      <p class="hero__sub">
        Un gros PDF d'attestations&nbsp;→&nbsp;un fichier par personne,
        rangé par créneau, le tout dans un&nbsp;<strong>.zip</strong>.
      </p>
    </header>

    <!-- Étape 1 : dépôt du fichier -->
    <section class="card" id="dropCard">
      <label class="drop" id="drop" for="fileInput">
        <input type="file" id="fileInput" accept="application/pdf,.pdf" hidden />
        <div class="drop__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 16V4" /><path d="m7 9 5-5 5 5" /><path d="M5 16v2a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-2" />
          </svg>
        </div>
        <div class="drop__text">
          <span class="drop__strong">Déposez le PDF ici</span>
          <span class="drop__hint">ou cliquez pour choisir un fichier</span>
        </div>
      </label>
      <p class="drop__file" id="fileName" hidden></p>
    </section>

    <!-- Étape 2 : analyse en cours -->
    <section class="card progress" id="parsing" hidden>
      <div class="progress__head">
        <span class="spinner" aria-hidden="true"></span>
        <span id="parsingLabel">Lecture du document…</span>
      </div>
      <div class="bar"><div class="bar__fill" id="parseBar"></div></div>
    </section>

    <!-- Étape 3 : revue + export -->
    <section id="results" hidden>
      <div class="stats" id="stats"></div>

      <div class="card warn" id="warnBox" hidden>
        <strong id="warnTitle"></strong>
        <div id="warnBody" class="warn__body"></div>
      </div>

      <div class="toolbar">
        <h2 class="toolbar__title">Aperçu du découpage</h2>
        <button class="btn btn--primary" id="exportBtn">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><path d="m7 10 5 5 5-5" /><path d="M12 15V3" />
          </svg>
          Exporter le .zip
        </button>
      </div>

      <div id="groups"></div>
    </section>

    <footer class="foot">
      <span>Tout se passe sur votre ordinateur — aucun fichier n'est envoyé sur internet.</span>
    </footer>
  </main>

  <!-- Overlay d'export -->
  <div class="overlay" id="overlay" hidden>
    <div class="overlay__panel">
      <span class="spinner spinner--lg" aria-hidden="true"></span>
      <p id="overlayLabel">Génération du .zip…</p>
      <div class="bar"><div class="bar__fill" id="exportBar"></div></div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
